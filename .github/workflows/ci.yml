name: CI backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: correr las pruebas unitarias
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r tests/requirements.txt

      - name: Ejecutar pruebas
        run: pytest -v

  # JOB 2: construir y publicar la imagen, SOLO si las pruebas pasaron
  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular SHA corto
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/folios-backend:${{ env.SHORT_SHA }}
            ${{ secrets.DOCKERHUB_USERNAME }}/folios-backend:latest